[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-ai"
version = "0.1.0"
description = "Dream AI — an open-source, general-purpose AI assistant built around one shared dream."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Li Guijiang", email = "li-guijiang@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["ai-agent", "llm", "general-purpose", "assistant", "open-source"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "openai>=1.40,<2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dream-ai = "dream_ai.cli:main"

[tool.setuptools.packages.find]
include = ["dream_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
