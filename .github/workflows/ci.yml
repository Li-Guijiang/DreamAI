name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check dream_ai tests examples web/app

      - name: Check formatting
        run: ruff format --check dream_ai tests examples

      - name: Check web JavaScript syntax
        run: |
          for file in web/web/assets/js/*.js web/web/sw.js; do
            node --check "$file"
          done
          for file in desktop/electron/*.js; do
            node --check "$file"
          done
          node desktop/test/update.test.js

      - name: Check desktop updater logic
        run: |
          for file in desktop/electron/semver.js desktop/electron/update.js \
                      desktop/electron/update-schedule.js desktop/electron/update-feed.js \
                      desktop/electron/update-service.js desktop/electron/installer.js \
                      desktop/electron/protocol.js; do
            node --check "$file"
          done
          node desktop/test/update.test.js
          node desktop/test/update-schedule.test.js
          node desktop/test/update-feed.test.js
          node desktop/test/update-service.test.js
          node desktop/test/protocol.test.js

      - name: Check the release manifest against the build
        run: python web/tools/make_downloads.py --check

      - name: Run tests with pytest
        run: pytest
