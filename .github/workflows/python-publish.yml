# Build the Python distributions and (optionally) publish to PyPI.
#
# PyPI publishing is disabled by default. It only runs when the repository
# variable ENABLE_PYPI_PUBLISH is set to "true" and the project has trusted
# publishing (or a PyPI API token secret) configured. Until then this
# workflow builds the sdist/wheel and keeps them as an artifact only.
#
# To enable publishing later:
#   1. Register the project on PyPI and configure a GitHub trusted publisher.
#   2. Repository Settings → Secrets and variables → Actions → set the
#      variable ENABLE_PYPI_PUBLISH=true.
#   3. Add a release trigger (release: [published]) to run it on every release.

name: Publish Python Package (PyPI, opt-in)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
