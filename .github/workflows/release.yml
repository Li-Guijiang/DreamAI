name: Release

# Triggered when a version tag (e.g. v0.1.0) is pushed.
# Builds the sdist and wheel, validates metadata, and creates a GitHub Release
# with the built artifacts attached.
#
# Note: GitHub Packages does not host Python/pip packages, so distributions are
# attached to the Release below rather than published to a package registry.
# A future public release can be published to PyPI separately.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release and upload assets

jobs:
  release:
    name: Build and publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
