name: Publish Container

# Builds the Dream AI image and pushes it to the GitHub Container Registry
# (ghcr.io), which appears under the repository's Packages section. Runs on
# every version tag and can be started manually from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish on manual dispatch"
        default: "latest"
        required: false

permissions:
  contents: read
  packages: write   # push the image to ghcr.io

jobs:
  container:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/li-guijiang/dream-ai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Dream AI
            org.opencontainers.image.description=Open-source general-purpose AI assistant built around one shared dream.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/Li-Guijiang/DreamAI
            org.opencontainers.image.url=https://github.com/Li-Guijiang/DreamAI

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
