name: Publish Container

# Builds the Dream AI image and pushes it to the GitHub Container Registry
# (ghcr.io), which appears under the repository's Packages section.
#
# Triggers:
#   1. push to main -> tags `edge` and `sha-<short>`, so the image tracks the
#      branch instead of ageing until the next release;
#   2. push of a `v*` tag -> semver tags plus `latest`;
#   3. manual dispatch -> `latest` and an optional extra tag.
#
# Before this ran on release tags only, so every merge between two releases left
# the published package describing older code than the repository.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish on manual dispatch"
        default: "latest"
        required: false

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push the image to ghcr.io

jobs:
  container:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/li-guijiang/dream-ai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Dream AI
            org.opencontainers.image.description=Open-source general-purpose AI assistant built around one shared dream.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/Li-Guijiang/DreamAI
            org.opencontainers.image.url=https://github.com/Li-Guijiang/DreamAI
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
