# Categories used when GitHub generates release notes (paired with
# generate_release_notes: true in release.yml). Notes are grouped by the labels
# of the pull requests merged into main; anything unlabelled lands in the
# catch-all group.

changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
        - feature
    - title: Bug fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Engineering and dependencies
      labels:
        - chore
        - refactor
        - style
        - dependencies
        - ci
    - title: Other changes
      labels:
        - "*"
