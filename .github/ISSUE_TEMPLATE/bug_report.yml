name: Bug report
description: Report a reproducible defect (wrong behaviour, an error, a rendering problem)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can - issues without reproduction
        steps usually cannot be diagnosed.

        If this is a security problem, do NOT file it here. Follow SECURITY.md instead.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which deliverable does the problem appear in?
      options:
        - CLI package (python -m dream_ai)
        - Web service (liguijiang.com or a local uvicorn)
        - Windows desktop app
        - Documentation
        - Build / CI / packaging
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: For the CLI run "pip show dream-ai"; for the web app use the version from /api/config; for the desktop app give the installer file name.
      placeholder: e.g. 0.4.0 / 1.4.0 / DreamAI-Setup-1.2.0.exe
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimal path, in order.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the full stack trace for errors; attach a screenshot for UI problems.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11 / macOS 15 / Ubuntu 24.04
        Python: 3.12.4
        Node (desktop): 22
        Model backend: DeepSeek / Zhipu / local Ollama
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I removed API keys and other secrets from logs and screenshots
          required: true
