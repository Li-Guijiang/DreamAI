name: Feature request
description: Propose a new capability, improve existing behaviour, or point out a design problem
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the ROADMAP first - what you want may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: The situation you hit
      description: Describe the real scenario rather than only the conclusion. Why is today's behaviour not enough?
      placeholder: e.g. When /run executes a multi-step task and one step fails, I cannot tell how many attempts it made ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: Describe the expected behaviour or interface, and any alternatives you considered.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related module
      options:
        - dream_ai/core (agent, conversation)
        - dream_ai/providers (model backends)
        - dream_ai/memory (memory and preferences)
        - dream_ai/tools (tool layer)
        - dream_ai/autonomy (planning)
        - web (service and front end)
        - desktop (desktop app)
        - Documentation and tooling
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I am willing to open a pull request for this
          required: false
