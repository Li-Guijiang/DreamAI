name: 功能建议
description: 提出新能力、改进现有行为，或指出设计上的问题
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前建议先看 [路线图](https://github.com/Li-Guijiang/DreamAI/blob/main/docs/ROADMAP.md)，
        你想要的改动可能已经在计划中。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 描述真实使用场景，而不是只给结论。说明现在为什么不够用。
      placeholder: 例如：用 /run 跑一个多步任务时，中途某步失败后我不知道它重试了几次……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 描述期望的行为或接口。如果有替代方案，也一并写出。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - dream_ai/core（agent、会话）
        - dream_ai/providers（模型后端）
        - dream_ai/memory（记忆与偏好）
        - dream_ai/tools（工具层）
        - dream_ai/autonomy（自主规划）
        - web（Web 服务与前端）
        - desktop（桌面端）
        - 文档与工程配置
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已经考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 issue，没有重复
          required: true
        - label: 愿意提交 PR 实现这个建议
          required: false
