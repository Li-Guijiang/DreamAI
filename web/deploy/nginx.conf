# Dream AI · Nginx 站点配置（由 deploy/install.sh 渲染）
# 静态文件由 Nginx 直接提供，/api/ 反向代理到本机 FastAPI（SSE 需要关闭缓冲）。

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:DreamAI:10m;
    ssl_session_timeout 1d;

    root  __ROOT__/web;
    index index.html;

    server_tokens off;
    access_log __LOG_DIR__/__DOMAIN__.log;
    error_log  __LOG_DIR__/__DOMAIN__.error.log;

    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- 流式对话接口 ----
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- 老师的静态工具（/lsl：刷题工具、实验平台）----
    # 注意：站点 root 是 web/，lsl 是它的同级目录，必须单独指过去，
    # 否则会被下面的 SPA fallback 当成前端路由，显示 Dream AI 页面。
    location = /lsl { return 301 /lsl/; }

    # 根目录没有 landing page，直接进刷题工具
    location = /lsl/ { return 302 /lsl/%E5%88%B7%E9%A2%98%E5%B7%A5%E5%85%B7/; }

    location /lsl/ {
        root /www/wwwroot/liguijiang.com;
        index index.html;
        # 目录不带斜杠时先 301，保证 ./assets/... 相对路径正确
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # ---- 静态资源：长缓存（expires 会保留上层安全响应头）----
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # ---- 入口 HTML：不缓存，保证发版即时生效 ----
    location = /index.html {
        expires -1;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}

# www 统一跳转到主域名（证书包含 www）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__$request_uri;
}
